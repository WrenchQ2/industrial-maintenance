<!DOCTYPE html>
<!--
  SERVMOTION CONTROL · Interfaz del Técnico

  Documento único del prototipo frontend. Define:
  1) La cabecera con metadatos y la hoja de estilos.
  2) El sprite SVG con todos los iconos reutilizables.
  3) El armazón fijo: sidebar de navegación y barra superior.
  4) El contenedor <main> donde script.js inyecta cada vista.

-->

</head>

<!--
    Armazón de la aplicación. El sidebar permanece fijo a la izquierda y
    el contenido se desplaza a su derecha. En móvil el sidebar se convierte
    en un panel deslizante controlado por script.js.
  -->

        </button>

    </aside>

    <!-- Cortina oscura que cierra el menú móvil al tocar fuera -->
    <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>

    <!-- Columna principal: barra superior, avisos, contenido y pie -->
    <div class="app-main">
      <!-- Barra superior fija con identificador de página, buscador y acciones -->

            </div>
          </div>

            Los resultados se generan en #global-results y el atajo "/" enfoca el campo.
          -->

          </div>

          <div class="topbar-actions">

            <div class="popover-wrap">
              <button class="icon-btn notif-btn" id="notif-btn" type="button" aria-label="Notificaciones" aria-haspopup="true" aria-expanded="false" aria-controls="notif-panel">

                <span class="notif-badge" id="notif-badge" hidden>0</span>
              </button>
              <div class="notif-panel" id="notif-panel" role="region" aria-label="Notificaciones" hidden></div>
            </div>

            <div class="popover-wrap user-menu" id="user-menu">
              <button class="user-btn" id="user-menu-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="user-dropdown">

              </button>
              <div class="user-dropdown" id="user-dropdown" role="menu" hidden></div>
            </div>
          </div>
        </div>
      </header>

      <div class="storage-banner" id="storage-banner" role="alert" hidden></div>

      <!-- Contenedor de vistas: script.js pinta aquí el HTML de cada ruta -->
      <main id="app" class="main-content" tabindex="-1"></main>
